<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc">
  <title id="title">Ilustração da primeira lei de Newton</title>
  <desc id="desc">Carrinho em uma superfície com seta indicando movimento constante quando a força resultante é nula.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f4"/>
      <stop offset="1" stop-color="#f7f2ff"/>
    </linearGradient>
    <linearGradient id="cart" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff5b35"/>
      <stop offset="1" stop-color="#e21b23"/>
    </linearGradient>
  </defs>
  <rect width="900" height="460" rx="28" fill="url(#bg)"/>
  <path d="M80 340H820" stroke="#2a2a2d" stroke-width="9" stroke-linecap="round" opacity=".75"/>
  <rect x="300" y="235" width="230" height="90" rx="18" fill="url(#cart)"/>
  <circle cx="350" cy="345" r="34" fill="#202023"/>
  <circle cx="480" cy="345" r="34" fill="#202023"/>
  <circle cx="350" cy="345" r="13" fill="#f6f6f7"/>
  <circle cx="480" cy="345" r="13" fill="#f6f6f7"/>
  <path d="M250 150H560" stroke="#e21b23" stroke-width="15" stroke-linecap="round"/>
  <path d="m560 150-48-30v60Z" fill="#e21b23"/>
  <text x="280" y="115" fill="#1d1d1f" font-family="Arial, sans-serif" font-size="31" font-weight="700">velocidade constante</text>
  <text x="258" y="420" fill="#5d5d63" font-family="Arial, sans-serif" font-size="28">Força resultante = 0 N</text>
</svg>
